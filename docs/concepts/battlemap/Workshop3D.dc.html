<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>

  <style>
    body { margin: 0; background: #16130f; color: #ede7da; font-family: Inter, ui-sans-serif, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #d9b061; text-decoration: none; } a:hover { color: #e8c988; }
    button { font-family: inherit; cursor: pointer; }
    button:focus-visible, a:focus-visible { outline: 2px solid #e8c988; outline-offset: 2px; }
  </style>
</helmet>
<div style="width: 1600px; height: 960px; display: flex; flex-direction: column; background: #16130f; overflow: hidden;">

      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>

    </a>
    <div style="width: 1px; height: 28px; background: #33291d;"></div>
    <div style="display: flex; flex-direction: column; gap: 1px;">
      <span style="font-family: Cinzel, serif; font-size: 10px; font-weight: 600; letter-spacing: 0.18em; color: #d9b061;">THE WORKSHOP</span>
      <span style="font-family: Fraunces, Georgia, serif; font-size: 19px; font-weight: 550; letter-spacing: -0.01em;">Blackwood Manor</span>
    </div>
    <div style="flex-grow: 1;"></div>
    <nav aria-label="View" style="display: flex; padding: 3px; gap: 2px; border: 1px solid #33291d; border-radius: 8px; background: #262019;">
      <a href="Main.dc.html" style="display: flex; align-items: center; padding: 6px 14px; border-radius: 6px; color: #c9bfad; font-size: 13px;">Flat board</a>
      <span style="display: flex; align-items: center; padding: 6px 14px; border-radius: 6px; background: {{accent}}; color: #16130f; font-size: 13px; font-weight: 600;">Stand it up</span>

    <div style="flex-grow: 1;"></div>
    <span style="font-size: 12px; color: #a89f8d;">Saved a moment ago</span>
    <button type="button" style="height: 36px; padding: 0 16px; border: 0; border-radius: 8px; background: {{accent}}; color: #16130f; font-size: 13px; font-weight: 600;">Show the party</button>

  <div style="flex-grow: 1; display: flex; min-height: 0;">

      <section style="display: flex; flex-direction: column; gap: 10px;">

          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v5h5"></path></svg>
        </button>
        <button type="button" onClick="{{turnRight}}" aria-label="Turn right" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 8px; background: #262019; color: #ede7da;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.4-5.7M20 4v5h-5"></path></svg>

        <div style="width: 1px; height: 28px; background: #33291d;"></div>
        <div style="display: flex; gap: 2px;">
          <sc-for list="{{tilts}}" as="c" hint-placeholder-count="3">

        </div>
        <div style="width: 1px; height: 28px; background: #33291d;"></div>

    </main>
  </div>
</div>

const MATS = { void: '#16130f', stone: '#3a342b', dirt: '#4a3d2c', grass: '#3b4a2e', wood: '#5a4328', water: '#2c3f52', rubble: '#4d4237', lava: '#6b2f22' };

function edgesOf(def) {
  const m = new Map();
  for (const r of def.rooms) {
    const kind = r.wall || 'solid';
    const put = (k) => { if (!m.has(k)) m.set(k, kind); };
    for (let i = 0; i < r.w; i++) { put('h:' + (r.x + i) + ':' + r.y); put('h:' + (r.x + i) + ':' + (r.y + r.h)); }
    for (let j = 0; j < r.h; j++) { put('v:' + r.x + ':' + (r.y + j)); put('v:' + (r.x + r.w) + ':' + (r.y + j)); }
  }
  for (const k of def.doors || []) m.set(k, 'door');
  for (const k of def.windows || []) m.set(k, 'window');
  const groups = {};
  for (const [k, kind] of m) {
    const parts = k.split(':');
    const e = { o: parts[0], x: +parts[1], y: +parts[2], kind: kind };
    const g = e.o === 'h' ? 'h' + e.y : 'v' + e.x;
    (groups[g] = groups[g] || []).push(e);
  }
  const runs = [];
  for (const g in groups) {
    const arr = groups[g];
    const at = (e) => (e.o === 'h' ? e.x : e.y);
    arr.sort((p, q) => at(p) - at(q));
    let cur = null;
    for (const e of arr) {
      if (cur && cur.kind === e.kind && at(e) === cur.start + cur.len) cur.len++;
      else { cur = { o: e.o, x: e.x, y: e.y, kind: e.kind, start: at(e), len: 1 }; runs.push(cur); }
    }
  }
  return runs;
}

    const exploded = s.mode === 'exploded';
    const GAP = 180;
    const zOf = (i) => LEVELS[i].feet * 4 + (exploded ? (i - 1) * GAP : 0);
    const ftLabel = (f) => (f > 0 ? '+' + f + ' ft' : f < 0 ? '−' + Math.abs(f) + ' ft' : '0 ft');

    const planes = [];
    const trees = [];
    const tokens = [];
    const tf = (z, rest) => 'translateZ(' + z + 'px)' + (rest ? ' ' + rest : '');
    const stand = (z) => 'translateZ(' + z + 'px) rotateZ(' + -s.spin + 'deg) rotateX(-90deg)';

    const drawLevel = (i, o, opts) => {
      const id = LEVELS[i].id;
      const def = DEFS[id];
      const z = zOf(i);
      if (id === 'ground' && opts.garden) {
        planes.push({ l: 0, t: 0, w: 680, h: 480, bg: GRID + MATS.grass, bd: '0', r: '0', o: o, origin: '0 0', tf: tf(z) });
        const side = '#2a2118';
        planes.push({ l: 0, t: 480, w: 680, h: 16, bg: side, bd: '0', r: '0', o: o, origin: '0 0', tf: tf(z, 'rotateX(-90deg)') });
        planes.push({ l: 0, t: 0, w: 680, h: 16, bg: side, bd: '0', r: '0', o: o, origin: '0 0', tf: tf(z, 'rotateX(-90deg)') });
        planes.push({ l: 680, t: 0, w: 16, h: 480, bg: '#221a12', bd: '0', r: '0', o: o, origin: '0 0', tf: tf(z, 'rotateY(90deg)') });
        planes.push({ l: 0, t: 0, w: 16, h: 480, bg: '#221a12', bd: '0', r: '0', o: o, origin: '0 0', tf: tf(z, 'rotateY(90deg)') });
      }
      if (opts.ghostOnly) return;
      for (const r of [].concat(def.base || [], def.rooms, def.patches || [])) {
        planes.push({ l: r.x * T, t: r.y * T, w: r.w * T, h: r.h * T, bg: GRID + MATS[r.mat], bd: '0', r: '0', o: o, origin: '0 0', tf: tf(z + 0.5) });
      }
      for (const hle of def.holes || []) {
        planes.push({ l: hle.x * T, t: hle.y * T, w: hle.w * T, h: hle.h * T, bg: '#0d0b08', bd: '1px solid ' + accent, r: '0', o: o, origin: '0 0', tf: tf(z + 1) });
      }
      const low = opts.low;
      for (const w of edgesOf(def)) {
        let hgt = 40, bg = w.o === 'h' ? '#cbbd9e' : '#a8987a', bd = '0';
        if (w.kind === 'door') { hgt = 32; bg = '#7a5c2e'; bd = '1px solid ' + accent; }
        if (w.kind === 'window') { bg = 'rgba(138,164,189,0.35)'; bd = '1px solid #8aa4bd'; }
        if (w.kind === 'rail') { hgt = 12; bg = 'repeating-linear-gradient(90deg, #a89f8d 0 2px, transparent 2px 7px)'; }
        if (low && w.kind !== 'rail') hgt = 12;
        if (w.o === 'h') {
          planes.push({ l: w.x * T, t: w.y * T, w: w.len * T, h: hgt, bg: bg, bd: bd, r: '0', o: o, origin: '0 0', tf: tf(z, 'rotateX(90deg)') });
        } else {
          planes.push({ l: w.x * T, t: w.y * T, w: hgt, h: w.len * T, bg: bg, bd: bd, r: '0', o: o, origin: '0 0', tf: tf(z, 'rotateY(-90deg)') });
        }
      }
      for (const p of def.props) {
        const st = LIFT[p.kind];
        planes.push({ l: p.x * T + st.ins, t: p.y * T + st.ins, w: p.w * T - 2 * st.ins, h: p.h * T - 2 * st.ins, bg: st.bg, bd: '1px solid rgba(0,0,0,0.5)', r: st.r, o: o, origin: '0 0', tf: tf(z + st.z) });
      }
      if (opts.trees) {
        for (const t of def.trees) {
          const w = Math.round(30 * t[2]), h = Math.round(52 * t[2]);
          trees.push({ l: (t[0] + 0.5) * T - w / 2, t: (t[1] + 0.5) * T - h, w: w, h: h, o: o, tf: stand(z) });
        }
      }
      if (opts.tokens) {
        for (const k of def.tokens) {
          const ring = k.party ? accent : '#d9756c';
          tokens.push({ bl: k.x * T + 2, bt: k.y * T + 2, btf: tf(z + 1), l: k.x * T + 3, t: k.y * T + 10 - 22, n: k.n, ring: ring, o: o, tf: stand(z + 1) });
        }
      }
    };

    const drawStairs = (st, o) => {
      const fi = LEVELS.findIndex((l) => l.id === st.from);
      const ti = LEVELS.findIndex((l) => l.id === st.to);
      const z0 = zOf(fi), rise = zOf(ti) - z0;
      const run = st.h * T;
      const len = Math.sqrt(run * run + rise * rise);
      const ang = Math.atan(rise / run) * 180 / Math.PI;
      planes.push({
        l: st.x * T, t: (st.y + st.h) * T - len, w: st.w * T, h: len,
        bg: exploded ? 'repeating-linear-gradient(0deg, rgba(217,176,97,0.55) 0 4px, rgba(217,176,97,0.12) 4px 10px)' : 'repeating-linear-gradient(0deg, #b09a72 0 4px, #5c4f3a 4px 10px)',
        bd: '1px solid ' + accent, r: '0', o: o, origin: '50% 100%', tf: tf(z0 + 0.5, 'rotateX(' + -ang + 'deg)'),
      });
    };

    const vis = {};
    LEVELS.forEach((l, i) => {
      let o = 0, show = false;
      if (s.mode === 'cutaway') { show = i <= ai && (i === ai || l.id !== 'cellar'); o = 1; }
      else if (s.mode === 'stacked') { show = l.id !== 'cellar' || ai === 0; o = i > ai ? 0.12 : 1; }
      else { show = true; o = i === ai ? 1 : 0.5; }
      vis[l.id] = { show: show, o: o };
      if (show) {
        drawLevel(i, o, {
          garden: s.flags.garden,
          low: s.flags.low && s.mode === 'cutaway' && i === ai,
          trees: s.flags.garden,
          tokens: s.flags.tokens,
        });
      }
    });
    if (s.mode === 'cutaway' && ai === 0) drawLevel(1, 0.1, { garden: true, ghostOnly: true });
    for (const st of STAIRS) {
      if (vis[st.from].show) drawStairs(st, vis[st.from].o);
    }

    const levels = LEVELS.slice().reverse().map((l) => {
      const on = l.id === s.level;
      const d = DEFS[l.id];
      const party = d.tokens.filter((t) => t.party).length;
      const foes = d.tokens.length - party;
      const pips = [];
      for (let i = 0; i < party; i++) pips.push(accent);
      for (let i = 0; i < foes; i++) pips.push('#d9756c');
      const bits = [d.rooms.length + (d.rooms.length === 1 ? ' room' : ' rooms')];
      if (party) bits.push(party + ' heroes');
      if (foes) bits.push(foes + (foes === 1 ? ' foe' : ' foes'));
      return {
        name: l.name, short: l.short, ft: ftLabel(l.feet), sub: bits.join(' · '), pips: pips, on: on, pick: set({ level: l.id }),
        bg: on ? 'rgba(217,176,97,0.12)' : '#1e1a14', bd: on ? accent : '#33291d', ftColor: on ? accent : '#a89f8d',
        elBg: on ? accent : 'transparent', elFg: on ? '#16130f' : '#c9bfad',
      };
    });

    const MODES = [
      { id: 'cutaway', label: 'Cutaway', sub: 'Everything above this floor lifts off. Its walls drop to knee height.', d: 'M4 18l11 6 11-6-11-6zM4 18v-4M26 18v-4M15 24v-4M8 12l7-4 7 4' },
      { id: 'stacked', label: 'Stacked', sub: 'The whole house. Floors above turn to glass.', d: 'M4 22l11 6 11-6-11-6zM4 15l11 6 11-6-11-6zM4 8l11 6 11-6-11-6z' },
      { id: 'exploded', label: 'Pulled apart', sub: 'Floors spread out, stairs drawn between them.', d: 'M4 25l11 4 11-4-11-4zM4 15l11 4 11-4-11-4zM4 5l11 4 11-4L15 1zM15 9v2M15 19v2' },
    ];
    const modes = MODES.map((m) => {
      const on = m.id === s.mode;
      return Object.assign({}, m, { on: on, pick: set({ mode: m.id }), bg: on ? 'rgba(217,176,97,0.12)' : '#1e1a14', bd: on ? accent : '#33291d', fg: on ? accent : '#ede7da' });
    });
    const flag = (key, label) => {
      const on = !!s.flags[key];
      return { label: label, on: on, track: on ? accent : '#3d3226', knob: on ? 17 : 3, pick: () => this.setState({ flags: Object.assign({}, s.flags, { [key]: !on }) }) };
    };
    const tiltNow = exploded ? 72 : s.tilt;
    const tilts = [['From above', 30], ['Tilted', 58], ['Low', 70]].map((c) => {
      const on = !exploded && c[1] === s.tilt;
      return { label: c[0], pick: set({ tilt: c[1] }), bg: on ? accent : 'transparent', fg: on ? '#16130f' : '#c9bfad' };
    });
    const L = LEVELS[ai];
    const modeLine = { cutaway: 'cut away above', stacked: 'the whole house', exploded: 'floors pulled apart' }[s.mode];
    const centerZ = exploded ? -130 : s.mode === 'stacked' ? -30 : -Math.max(0, zOf(ai)) / 2;

    return {
      accent: accent,
      levels: levels,
      modes: modes,
      flags: [flag('low', 'Knee-high walls on this floor'), flag('garden', 'Show the garden'), flag('tokens', 'Show everyone on the board')],
      tilts: tilts,
      levelName: L.name,
      levelFt: ftLabel(L.feet),
      modeLine: modeLine,
      planes: planes,
      trees: trees,
      tokens: tokens,
      spin: s.spin,
      tilt: tiltNow,
      zoom: exploded ? s.zoom * 0.62 : s.zoom,
      shiftY: exploded ? 40 : 30,
      centerZ: centerZ,
      turnLeft: set({ spin: s.spin - 45 }),
      turnRight: set({ spin: s.spin + 45 }),
      zoomIn: set({ zoom: Math.min(1.8, s.zoom + 0.15) }),
      zoomOut: set({ zoom: Math.max(0.6, s.zoom - 0.15) }),
    };
  }
}
</script>
</body>
</html>
